<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="fused-app" />
<meta name="fused-api-version" content="1" />
<meta name="fused-app-id" content="mp3-player-manager-e372c3e0" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Grabs songs from YouTube, converts them to MP3 with cover art, and copies them onto your MP3 player." />
<title>MP3 Player</title>
<style>
  :root {
    color-scheme: light;
    --bg: #ffeef5; --bg-deep: #ffd9e8; --surface: #ffffff; --surface-2: #fff4f8;
    --ink: #4b2338; --ink-soft: #9a6b84; --ink-faint: #c4a3b4;
    --rose: #f06ba3; --rose-deep: #d9457f; --rose-light: #ffc2d9; --rose-pale: #ffe3ee;
    --line: #f7d6e4; --ok: #2f8f5b; --err: #d0325c;
    --glow: rgba(240, 107, 163, .22);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { margin: 0; -webkit-tap-highlight-color: transparent; }
  button, input, select, textarea { font: inherit; color: inherit; margin: 0; }
  ::placeholder { color: var(--ink-faint); opacity: 1; }
  input, select, textarea, progress { accent-color: var(--rose); }
  img, svg, video, canvas { display: block; max-width: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.5; color: var(--ink);
    background: var(--bg);
    background-image: radial-gradient(70% 50% at 50% 0%, var(--bg-deep), transparent 75%);
    background-attachment: fixed;
    min-height: 100vh; min-height: 100dvh;
    overflow-x: hidden;
  }
  .serif, h1, h2, .empty strong, .who { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif; }
  main { position: relative; max-width: 560px; margin: 0 auto; padding: 36px 22px 120px; }

  /* top bar */
  .bar { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
  .bar .mark { flex: none; width: 28px; height: 28px; }
  .bar .name { font-weight: 600; font-size: 14px; }
  .bar .who { margin-left: 6px; color: var(--rose-deep); font-size: 14px; font-style: italic; }

  /* hero */
  .hero {
    position: relative; z-index: 1; display: flex; align-items: center; gap: 18px; padding: 26px 26px 26px 28px;
    border-radius: 26px; background: var(--surface); border: 1px solid var(--line);
    box-shadow: 0 24px 48px -32px var(--glow); margin-bottom: 92px;
  }
  .hero-text { min-width: 0; flex: 1; }
  .hero h1 { font-weight: 400; font-size: 32px; line-height: 1.1; letter-spacing: -.01em; margin: 0 0 6px; }
  .hero .lead { margin: 0; color: var(--ink-soft); font-size: 14px; }
  .stats { display: flex; gap: 22px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .stat b { display: block; font-weight: 600; font-size: 17px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--ink-soft); font-size: 12.5px; }
  .turntable { flex: none; width: 190px; margin: -6px -8px -6px 0; -webkit-filter: drop-shadow(0 14px 22px var(--glow)); filter: drop-shadow(0 14px 22px var(--glow)); }
  .fillbar { height: 6px; border-radius: 3px; background: var(--rose-pale); overflow: hidden; margin-top: 14px; }
  .fillbar > i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--rose-light), var(--rose)); -webkit-transition: width .6s ease; transition: width .6s ease; }

  /* add row */
  .add { position: relative; z-index: 1; margin-bottom: 34px; }
  .add input[type="url"] {
    width: 100%; height: 50px; padding: 0 104px 0 18px; border: 1px solid var(--line); border-radius: 14px;
    background: var(--surface); outline: none; color: var(--ink);
  }
  .add input[type="url"]:focus { border-color: var(--rose); box-shadow: 0 0 0 4px var(--glow); }
  .add button[type="submit"] {
    position: absolute; right: 6px; top: 6px; bottom: 6px; padding: 0 18px; border: 0; border-radius: 10px;
    background: var(--rose); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .add button[type="submit"]:disabled { opacity: .55; cursor: default; }

  .yt { display: flex; gap: 16px; padding: 16px 18px; border-radius: 16px; background: var(--surface);
        border: 1px solid var(--line); margin: -20px 0 34px; }
  .yt img { width: 128px; height: 72px; object-fit: cover; border-radius: 10px; flex: none; }
  .meta { min-width: 0; flex: 1; }
  .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dim { color: var(--ink-soft); font-size: 13px; }
  .actions { margin-top: 8px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .link {
    padding: 0; border: 0; background: none; color: var(--rose-deep); font-weight: 600; font-size: 13px; cursor: pointer;
    text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px;
    -webkit-transition: text-decoration-color .15s; transition: text-decoration-color .15s;
  }
  .link:disabled { opacity: .5; cursor: default; }
  progress {
    -webkit-appearance: none; appearance: none; width: 100%; height: 5px; margin-top: 10px;
    border: 0; border-radius: 3px; overflow: hidden; background: var(--line);
  }
  progress::-webkit-progress-bar { background: var(--line); }
  progress::-webkit-progress-value { background: var(--rose); border-radius: 3px; }
  progress::-moz-progress-bar { background: var(--rose); border-radius: 3px; }
  .status { margin-top: 6px; font-size: 13px; color: var(--ink-soft); }
  .status.err { color: var(--err); white-space: pre-wrap; word-break: break-word; }
  .status.ok { color: var(--ok); }

  /* playlist */
  .list-wrap { position: relative; z-index: 1; }
  .list-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 4px 10px; }
  .list-head h2 { font-weight: 400; font-size: 20px; margin: 0; }
  .list-head .usage { color: var(--ink-soft); font-size: 13px; }
  /* ledge = zero-height anchor on the card's top edge; the cat's body underside is at 68.2% of its height */
  .ledge { position: relative; height: 0; z-index: 2; }
  .cat-sleep { position: absolute; right: 18px; top: -56px; width: 170px; pointer-events: none; }
  .playlist { position: relative; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
  ul.tracks { list-style: none; margin: 0; padding: 6px; }
  .track { display: flex; align-items: center; gap: 14px; padding: 11px 12px; border-radius: 14px; }
  .track + .track { margin-top: 2px; }
  .art {
    width: 42px; height: 42px; border-radius: 12px; flex: none; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(150deg, var(--rose-light), var(--rose)); color: #fff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5);
  }
  .art svg { width: 20px; height: 20px; }
  .art { overflow: hidden; }
  .art img { width: 100%; height: 100%; object-fit: cover; }
  .track .title { font-size: 15px; }
  .track .dim { font-size: 12.5px; }
  .track .del {
    flex: none; padding: 6px 12px; border-radius: 999px; border: 1px solid transparent; background: none;
    color: var(--ink-faint); font-size: 13px; cursor: pointer;
    -webkit-transition: color .15s, background-color .15s, border-color .15s; transition: color .15s, background-color .15s, border-color .15s;
  }
  .track .del.arm { color: #fff; background: var(--err); border-color: var(--err); }
  .track .del:disabled { opacity: .5; cursor: default; }
  .empty { padding: 36px 24px 28px; text-align: center; color: var(--ink-soft); }
  .empty img { width: 120px; margin: 0 auto 6px; }
  .empty strong { display: block; color: var(--ink); font-weight: 400; font-size: 22px; margin-bottom: 4px; }
  .list-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 18px;
               border-top: 1px solid var(--line); background: var(--surface-2); font-size: 12.5px; color: var(--ink-soft); }
  .list-foot code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; color: var(--ink-faint); }
  .list-foot .link { font-size: 13px; }
  .list-foot .root-group { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
  .list-foot .root-group code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hidden { display: none !important; }
  .foot { margin: 26px 4px 0; color: var(--ink-faint); font-size: 12.5px; line-height: 1.55; }

  /* friends */
  .cat-peek { position: fixed; left: 4vw; bottom: -6px; width: 150px; z-index: 3; pointer-events: none; }
  /* hanging cat: body underside at 25.9% of its height; flipped so the legs dangle off the card's right edge */
  .cat-hang { position: absolute; right: -36px; top: -46px; width: 165px; pointer-events: none;
              -webkit-transform: scaleX(-1); transform: scaleX(-1); }
  /* sign cat: paws' underside at 82.9% of its height; grips the top of the URL field */
  .cat-sign { position: absolute; left: 22px; top: -80px; width: 150px; pointer-events: none; }
  .friend { opacity: 0; -webkit-transition: opacity .4s; transition: opacity .4s; }
  .friend.ready { opacity: 1; }

  @media (hover: hover) {
    .track:hover { background: var(--surface-2); }
    .track:hover .del { color: var(--err); }
    .link:hover { text-decoration-color: currentColor; }
    .add button[type="submit"]:not(:disabled):hover, .track .del:not(:disabled):hover { filter: brightness(1.06); }
  }
  :focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
  @media (pointer: coarse) { input, button { font-size: 16px; } }
  @media (max-width: 560px) {
    .hero { flex-direction: column-reverse; align-items: stretch; padding: 20px; }
    .hero h1 { font-size: 28px; }
    .turntable { width: 170px; margin: 0 auto 6px; }
    .stats { gap: 16px; }
    .cat-sleep { width: 130px; right: 10px; top: -43px; }
    .cat-hang { width: 130px; top: -36px; right: -24px; }
    .cat-sign { width: 120px; top: -64px; }
    .hero { margin-bottom: 76px; }
    .cat-peek { width: 110px; right: 2vw; }
    .bar .who { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { -webkit-transition: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <div class="bar">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc2d9"/>
      <stop offset=".6" stop-color="#f06ba3"/>
      <stop offset="1" stop-color="#d9457f"/>
      </linearGradient>
      </defs>
      <rect width="64" height="64" rx="16" fill="url(#g)"/>
      <circle cx="26" cy="43" r="10" fill="#fff"/>
      <rect x="30" y="12" width="7" height="31" fill="#fff"/>
      <path d="M37 12c8 2 12 7 12 15-4-5-8-7-12-7z" fill="#fff"/>
      </svg>
    <span class="name">MP3 Player</span>
    <!-- <span class="who">powered only for Nandini</span> -->
  </div>

  <div class="ledge"><img class="cat-hang friend" data-asset="assets/cat-hang.png" alt="" /></div>
  <header class="hero">
    <div class="hero-text">
      <h1 id="pill">Checking the player</h1>
      <p class="lead">Add songs from YouTube, remove the ones you are done with.</p>
      <div class="fillbar"><i id="devFill"></i></div>
      <div class="stats">
        <div class="stat"><b id="statSongs">–</b><span>songs</span></div>
        <div class="stat"><b id="statUsed">–</b><span>used</span></div>
        <div class="stat"><b id="statFree">–</b><span>free</span></div>
      </div>
    </div>
    <img class="turntable friend" data-asset="assets/turntable.png" alt="" />
  </header>

  <div class="ledge"><img class="cat-sign friend" data-asset="assets/cat-sign.png" alt="" /></div>
  <form id="form" class="add">
    <input id="url" type="url" placeholder="Paste a YouTube link to add a song" autocomplete="off" spellcheck="false" required aria-label="YouTube link" />
    <button id="fetch" type="submit">Add</button>
  </form>

  <div id="yt" class="yt hidden">
    <img id="thumb" alt="" />
    <div class="meta">
      <div id="ytTitle" class="title"></div>
      <div id="ytDim" class="dim"></div>
      <progress id="prog" class="hidden" max="1"></progress>
      <div id="status" class="status"></div>
      <div class="actions">
        <button id="start" type="button" class="link hidden">Add again</button>
        <button id="cancel" type="button" class="link hidden">Cancel</button>
      </div>
    </div>
  </div>

  <div class="list-wrap">
    <div class="list-head">
      <h2>On the player</h2>
      <span id="usageTxt" class="usage"></span>
    </div>
    <div class="ledge"><img class="cat-sleep friend" data-asset="assets/cat-sleep.png" alt="" /></div>
    <section class="playlist">
      <div id="listStatus" class="status hidden" style="padding: 12px 18px"></div>
      <ul id="tracks" class="tracks"></ul>
      <div id="empty" class="empty hidden"></div>
      <div class="list-foot">
        <div class="root-group">
        <code id="rootLabel"></code>
        <form id="rootForm" class="hidden" style="flex:1;min-width:0;display:flex;gap:10px;align-items:center">
          <input id="rootInput" type="text" spellcheck="false" style="flex:1;min-width:0;font:11.5px ui-monospace,Menlo,Consolas,monospace;padding:4px 8px" />
          <button type="submit" class="link">Save</button>
          <button id="rootReset" type="button" class="link">Default</button>
          <button id="rootCancel" type="button" class="link">Cancel</button>
        </form>
        <button id="rootEdit" type="button" class="link">Change</button>
        </div>
        <button id="refresh" type="button" class="link">Refresh</button>
      </div>
    </section>
  </div>

  <p class="foot">Songs are saved as best-quality MP3s with the video thumbnail as cover art and copied straight onto the player. Deleting a song removes it from the player for good.</p>

</main>
<img class="cat-peek friend" data-asset="assets/cat-peek.png" alt="" />

<script>
function isPreview() {
  if (new URLSearchParams(location.search).get("_preview") === "1") return true;
  try {
    let w = window;
    while (w.parent && w.parent !== w) {
      w = w.parent;
      if (new URLSearchParams(w.location.search).get("_preview") === "1") return true;
    }
  } catch (e) {}
  return false;
}
const PREVIEW = isPreview();
const PY = "./player.py";
const $ = id => document.getElementById(id);
const el = {
  form: $("form"), url: $("url"), fetch: $("fetch"), yt: $("yt"), thumb: $("thumb"),
  ytTitle: $("ytTitle"), ytDim: $("ytDim"), start: $("start"), cancel: $("cancel"),
  prog: $("prog"), status: $("status"), pill: $("pill"), refresh: $("refresh"),
  usageTxt: $("usageTxt"), devFill: $("devFill"),
  statSongs: $("statSongs"), statUsed: $("statUsed"), statFree: $("statFree"),
  rootLabel: $("rootLabel"), rootForm: $("rootForm"), rootInput: $("rootInput"),
  rootEdit: $("rootEdit"), rootReset: $("rootReset"), rootCancel: $("rootCancel"),
  listStatus: $("listStatus"), tracks: $("tracks"), empty: $("empty"),
};
let info = null, polling = null, heartbeat = null, job = null, cancelSent = false;
let armed = null;   // track name whose delete button is armed

function fmtDur(s) {
  if (s == null) return "";
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(sec).padStart(2, "0");
}
function fmtBytes(b) {
  if (!b) return "0 B";
  const u = ["B", "KB", "MB", "GB"]; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return b.toFixed(i ? 1 : 0) + " " + u[i];
}
function fmtDate(t) {
  try { return new Date(t * 1000).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); }
  catch (e) { return ""; }
}
function setStatus(node, msg, cls) {
  node.textContent = msg || "";
  node.classList.remove("err", "ok");
  if (cls) node.classList.add(cls);
  node.classList.toggle("hidden", node === el.listStatus && !msg);
}
function stopPolling() {
  if (polling) clearInterval(polling); polling = null;
  if (heartbeat) clearInterval(heartbeat); heartbeat = null;
}

/* ---------- assets ---------- */
function catUp() { return '<img src="' + fused.rawUrl("assets/cat-up.png") + '" alt="" />'; }
document.querySelectorAll("img[data-asset]").forEach(img => {
  img.addEventListener("load", () => img.classList.add("ready"));
  img.src = fused.rawUrl(img.dataset.asset);
});

/* ---------- device list ---------- */
const NOTE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>';

async function loadList() {
  el.refresh.disabled = true;
  try {
    const r = await fused.runPython(PY, { action: "list" }, { key: "list" });
    renderList(r);
    setStatus(el.listStatus, "");
  } catch (e) {
    setStatus(el.listStatus, e.message || String(e), "err");
  } finally {
    el.refresh.disabled = false;
  }
}

function showRootEditor(on) {
  el.rootForm.classList.toggle("hidden", !on);
  el.rootForm.style.display = on ? "flex" : "none";
  el.rootLabel.classList.toggle("hidden", on);
  el.rootEdit.classList.toggle("hidden", on);
  if (on) { el.rootInput.focus(); el.rootInput.select(); }
}
async function saveRoot(value) {
  try {
    const r = await fused.runPython(PY, { action: "set_root", url: value }, { key: "list" });
    renderList(r);
    setStatus(el.listStatus, "");
    showRootEditor(false);
  } catch (e) {
    setStatus(el.listStatus, e.message || String(e), "err");
  }
}
el.rootEdit.addEventListener("click", () => showRootEditor(true));
el.rootCancel.addEventListener("click", () => showRootEditor(false));
el.rootReset.addEventListener("click", () => saveRoot(""));
el.rootForm.addEventListener("submit", ev => { ev.preventDefault(); saveRoot(el.rootInput.value); });

function renderList(r) {
  el.rootLabel.textContent = r.root;
  el.rootInput.value = r.root;
  const n = r.tracks.length;
  el.pill.textContent = r.connected ? "Your player" : "Player not connected";
  el.statSongs.textContent = r.connected ? String(n) : "–";
  if (r.usage) {
    el.devFill.style.width = Math.min(100, r.usage.used / r.usage.total * 100).toFixed(1) + "%";
    el.statUsed.textContent = fmtBytes(r.usage.used);
    el.statFree.textContent = fmtBytes(r.usage.free);
    el.usageTxt.textContent = `${n} song${n === 1 ? "" : "s"}`;
  } else {
    el.devFill.style.width = "0%";
    el.statUsed.textContent = "–"; el.statFree.textContent = "–";
    el.usageTxt.textContent = "";
  }
  el.tracks.innerHTML = "";
  if (!r.connected) {
    el.empty.innerHTML = catUp() + "<strong>Plug in your player</strong>Connect it over USB, then press Refresh.";
    el.empty.classList.remove("hidden");
    return;
  }
  if (!n) {
    el.empty.innerHTML = catUp() + "<strong>Nothing on it yet</strong>Paste a YouTube link above to add your first song.";
    el.empty.classList.remove("hidden");
    return;
  }
  el.empty.classList.add("hidden");
  r.tracks.forEach(t => {
    const li = document.createElement("li");
    li.className = "track";
    const art = document.createElement("span"); art.className = "art";
    if (t.art) {
      const im = document.createElement("img"); im.alt = ""; im.src = fused.rawUrl(t.art);
      im.addEventListener("error", () => { art.innerHTML = NOTE_SVG; });
      art.appendChild(im);
    } else {
      art.innerHTML = NOTE_SVG;
    }
    const meta = document.createElement("div"); meta.className = "meta";
    const title = document.createElement("div"); title.className = "title"; title.textContent = t.title; title.title = t.name;
    const dim = document.createElement("div"); dim.className = "dim";
    dim.textContent = fmtBytes(t.size) + (t.mtime ? ", added " + fmtDate(t.mtime) : "");
    meta.append(title, dim);
    const del = document.createElement("button");
    del.type = "button"; del.className = "del";
    del.textContent = armed === t.name ? "Delete for good?" : "Delete";
    del.classList.toggle("arm", armed === t.name);
    del.addEventListener("click", () => onDelete(t.name, del));
    li.append(art, meta, del);
    el.tracks.appendChild(li);
  });
}

async function onDelete(name, btn) {
  if (armed !== name) {
    armed = name;
    document.querySelectorAll(".track .del").forEach(b => { b.textContent = "Delete"; b.classList.remove("arm"); });
    btn.textContent = "Delete for good?"; btn.classList.add("arm");
    setTimeout(() => { if (armed === name) { armed = null; btn.textContent = "Delete"; btn.classList.remove("arm"); } }, 4000);
    return;
  }
  armed = null;
  btn.disabled = true; btn.textContent = "Deleting…";
  try {
    const r = await fused.runPython(PY, { action: "delete", name }, { key: "delete" });
    renderList(r);
    setStatus(el.listStatus, "");
  } catch (e) {
    setStatus(el.listStatus, e.message || String(e), "err");
    btn.disabled = false; btn.textContent = "Delete"; btn.classList.remove("arm");
  }
}

/* ---------- add from youtube ---------- */
function showInfo(i) {
  info = i;
  el.yt.classList.remove("hidden");
  el.thumb.src = i.thumbnail || "";
  el.thumb.classList.toggle("hidden", !i.thumbnail);
  el.ytTitle.textContent = i.title || i.id;
  el.ytTitle.title = i.title || "";
  el.ytDim.textContent = [i.uploader, fmtDur(i.duration)].filter(Boolean).join(", ");
  el.prog.classList.add("hidden");
  el.cancel.classList.add("hidden");
  el.start.classList.add("hidden");
  el.start.disabled = false;
}

async function doFetch() {
  const url = el.url.value.trim();
  if (!url) return;
  fused.params.set("url", url);
  el.fetch.disabled = true;
  el.yt.classList.add("hidden");
  setStatus(el.status, "");
  try {
    const i = await fused.runPython(PY, { action: "info", url }, { key: "job" });
    showInfo(i);
    if (i.on_device) {
      setStatus(el.status, "Already on the player.", "ok");
      el.start.classList.remove("hidden");
    } else if (!i.connected) {
      setStatus(el.status, "Plug in the player, then press Add again.", "err");
      el.start.classList.remove("hidden");
    } else {
      doStart();
    }
  } catch (e) {
    el.yt.classList.remove("hidden");
    el.thumb.classList.add("hidden");
    el.ytTitle.textContent = "Could not read video";
    el.ytDim.textContent = "";
    setStatus(el.status, e.message || String(e), "err");
  } finally {
    el.fetch.disabled = false;
  }
}

async function doStart() {
  if (!info) return;
  el.start.disabled = true;
  el.prog.classList.remove("hidden");
  el.prog.removeAttribute("value");
  setStatus(el.status, "Starting…");
  let started;
  try {
    started = await fused.runPython(PY, { action: "start", url: info.webpage_url }, { key: "job" });
  } catch (e) {
    el.prog.classList.add("hidden");
    el.start.disabled = false; el.start.classList.remove("hidden");
    setStatus(el.status, e.message || String(e), "err");
    return;
  }
  info = started;
  cancelSent = false;
  el.cancel.classList.remove("hidden");
  job = fused.trackJob({ id: started.job_id, title: "MP3: " + (started.title || started.id),
                         kind: "download", unit: "bytes", cancellable: true });
  heartbeat = setInterval(() => { try { job.update({}); } catch (e) {} }, 10000);
  polling = setInterval(poll, 700);
}

async function poll() {
  if (!info || !info.status_rel) return;
  if (job && job.cancelRequested && !cancelSent) { cancelSent = true; doCancel(); }
  let st;
  try { st = JSON.parse(await fused.readFile(info.status_rel)); }
  catch (e) { return; }
  if (st.total) { el.prog.max = st.total; el.prog.value = st.done || 0; }
  else el.prog.removeAttribute("value");
  const pct = st.total ? ` ${Math.round((st.done || 0) / st.total * 100)}%` : "";
  if (st.state === "running" || st.state === "queued") {
    setStatus(el.status, (st.detail || "Working…") + (st.phase === "download" ? pct : ""));
    el.cancel.classList.remove("hidden"); el.prog.classList.remove("hidden");
    try { job.update({ done: st.done || 0, total: st.total || undefined, detail: st.detail }); } catch (e) {}
    return;
  }
  stopPolling();
  el.prog.classList.add("hidden"); el.cancel.classList.add("hidden");
  el.start.disabled = false;
  if (st.state === "done") {
    setStatus(el.status, "Added to your player", "ok");
    try { job.finish("On player"); } catch (e) {}
    loadList();
  } else if (st.state === "cancelled") {
    el.start.classList.remove("hidden");
    setStatus(el.status, "Cancelled.");
    try { job.cancelled(); } catch (e) {}
  } else {
    el.start.classList.remove("hidden");
    setStatus(el.status, st.error || st.detail || "Failed", "err");
    try { job.fail(st.detail || "failed"); } catch (e) {}
  }
  job = null;
}

async function doCancel() {
  if (!info) return;
  el.cancel.disabled = true;
  try { await fused.runPython(PY, { action: "cancel", url: info.job_id }, { key: "cancel" }); }
  catch (e) {}
  el.cancel.disabled = false;
}

el.form.addEventListener("submit", e => { e.preventDefault(); doFetch(); });
el.start.addEventListener("click", doStart);
el.cancel.addEventListener("click", doCancel);
el.refresh.addEventListener("click", loadList);

function draw() {
  const url = fused.params.get("url") || "";
  if (url !== el.url.value) el.url.value = url;
}
fused.params.onChange(draw);
draw();
if (!PREVIEW) {
  loadList();
} else {
  el.pill.textContent = "Your player";
  el.empty.innerHTML = catUp() + "<strong>Songs on your player</strong>Add from YouTube, remove what you are done with.";
  el.empty.classList.remove("hidden");
}
</script>
</body>
